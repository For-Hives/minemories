services:
  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in Coolify}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in Coolify}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-minemories}
      GARAGE_RPC_SECRET: ${SERVICE_HEX_64_RPCSECRET:?Set SERVICE_HEX_64_RPCSECRET in Coolify}
      GARAGE_ADMIN_TOKEN: ${SERVICE_PASSWORD_GARAGE:?Set SERVICE_PASSWORD_GARAGE in Coolify}
      GARAGE_METRICS_TOKEN: ${SERVICE_PASSWORD_GARAGEMETRICS:?Set SERVICE_PASSWORD_GARAGEMETRICS in Coolify}
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    volumes:
      - garage-meta-v2:/var/lib/garage/meta
      - garage-data-v2:/var/lib/garage/data
    configs:
      - source: garage-config
        target: /etc/garage.toml
    expose:
      - "3900"
      - "3902"
      - "3903"
    healthcheck:
      test: [CMD, /garage, stats, -a]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  garage-meta-v2:
  garage-data-v2:

configs:
  garage-config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      api_bind_addr = "[::]:3900"
      s3_region = "garage"

      [s3_web]
      bind_addr = "[::]:3902"
      root_domain = ".web-minestories.xenos.lightin.io"
      index = "index.html"

      [admin]
      api_bind_addr = "[::]:3903"
