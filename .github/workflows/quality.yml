name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      mod_sha256: ${{ steps.metadata.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Java 21 compiles/tests the mod; Java 25 runs Gradle.
          java-version: |
            21
            25
          cache: gradle
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run all checks and build applications
        run: bun run build

      - name: Verify real Garage lifecycle and recovery
        run: bun run api:garage

      - name: Read original mod checksum
        id: metadata
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("apps/web/public/downloads/manifest.json", "utf8"));
            appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${manifest.sha256}\n`);
          '

      - name: Keep the installable mod artifact
        uses: actions/upload-artifact@v7
        with:
          name: minemories-neoforge-mc1.21.1
          path: apps/web/public/downloads/*
          if-no-files-found: error
          retention-days: 14

  mod-artifact:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download the built mod in a separate job
        uses: actions/download-artifact@v8
        with:
          name: minemories-neoforge-mc1.21.1
          path: downloads
      - name: Verify the downloaded JAR and metadata
        env:
          BUILD_SHA256: ${{ needs.quality.outputs.mod_sha256 }}
        run: node scripts/verify-mod-artifact.mjs downloads "$BUILD_SHA256"
