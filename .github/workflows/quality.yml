name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which gates a change needs: a front-only pull request never starts the mod or the API (scripts/ci-scope.mjs).
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.scope.outputs.web }}
      api: ${{ steps.scope.outputs.api }}
      mod: ${{ steps.scope.outputs.mod }}
      discord: ${{ steps.scope.outputs.discord }}
      deps: ${{ steps.scope.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Test the scope rules
        run: node --test scripts/ci-scope.test.mjs
      - name: Read the scope of the change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs

  audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Audit locked dependencies
        run: bun audit

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check the film assets and the build scripts
        run: |
          bun run hero:check
          node --test scripts/boot-screen/*.test.mjs scripts/brand/*.test.mjs scripts/build-web.test.mjs scripts/prerender-web.test.mjs
      - name: Lint, typecheck and test the web app
        run: bun run web:check
      - name: Build the web app
        run: |
          bun run hero:assets
          node scripts/hero-assets/cli.mjs --check
          bun run web:build

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint, typecheck and test the API
        run: |
          bun run api:coverage:test
          bun run api:check
      - name: Verify real Garage lifecycle and recovery
        run: bun run api:garage

  mod:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          java: 'true'
      - name: Lint and test the `bun mod` tool
        run: |
          bunx biome check scripts package.json biome.json
          node --test scripts/mod/*.test.mjs scripts/mod/*/*.test.mjs
      - name: Check and build the mod (Minecraft 1.21.1 root)
        run: |
          bun run mod:check:ci
          bun run mod:build

  # The Discord sync scripts (scripts/discord/, run by .github/workflows/discord.yml): lint and tests, nothing is sent.
  discord:
    needs: changes
    if: needs.changes.outputs.discord == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint and test the Discord sync scripts
        run: |
          bunx biome check scripts/discord
          node --test scripts/discord/*.test.mjs

  # Every other Minecraft version and loader of mod/targets.json (the 1.21.1 root is built by `mod`). Any mod change, shared
  # core and common included, compiles and checks each of them, so a port never silently stops building.
  mod-cells:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: List the matrix cells
        id: cells
        run: node scripts/mod/cli.mjs ci

  mod-matrix:
    needs: mod-cells
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mod-cells.outputs.cells) }}
    name: mod ${{ matrix.loader }} ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
            25
          cache: gradle
      - name: Check and build ${{ matrix.loader }} for Minecraft ${{ matrix.minecraft }}
        env:
          MINEMORIES_MOD_DIR: ${{ matrix.dir }}
        run: node scripts/gradle.mjs ":${{ matrix.project }}:build"

  # The one check to read: green when every gate that had to run passed. A gate skipped because the change does not concern it counts as passed.
  quality:
    if: always()
    needs: [changes, audit, web, api, mod, mod-cells, mod-matrix, discord]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a gate that had to run failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Every required gate passed
        run: echo "web=${{ needs.web.result }} api=${{ needs.api.result }} mod=${{ needs.mod.result }} mod-matrix=${{ needs.mod-matrix.result }} discord=${{ needs.discord.result }} audit=${{ needs.audit.result }}"
