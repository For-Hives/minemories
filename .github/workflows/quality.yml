name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Pull requests only run the gates of the areas they touch; main always runs everything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      mod: ${{ steps.filter.outputs.mod }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/quality.yml'
              - '.bun-version'
              - 'package.json'
              - 'bun.lock'
              - 'biome.json'
              - 'tsconfig*.json'
              - 'scripts/**'
            web:
              - *shared
              - 'apps/web/**'
              - 'packages/api-contract/**'
            api:
              - *shared
              - 'apps/api/**'
              - 'packages/api-contract/**'
            mod:
              - 'mod/**'
              - 'config/mod-targets.json'
              - '.github/workflows/quality.yml'
              - 'scripts/gradle.mjs'
              - 'scripts/package-mod*.mjs'
              - 'scripts/verify-mod-artifact*.mjs'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run hero:check
      - run: bun run package:mod:test
      - run: bun run release:test
      - run: bun run web:check

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run api:coverage:test
      - run: bun run api:check
      - run: bun run api:garage

  mod:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - run: bun install --frozen-lockfile
      - run: bun run mod:check:ci
      - run: bun run mod:build
      - run: bun run package:mod:all

  # Single stable status for branch protection: skipped areas pass, failed or cancelled ones fail.
  quality-result:
    needs: [changes, web, api, mod]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a selected gate failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  quality:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      mod_checksums: ${{ steps.metadata.outputs.checksums }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Java 21 compiles/tests the mod; Java 25 runs Gradle.
          java-version: |
            21
            25
          cache: gradle
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit locked dependencies
        run: bun audit
      - name: Run all checks and build applications
        run: bun run build

      - name: Verify real Garage lifecycle and recovery
        run: bun run api:garage

      - name: Read original loader checksums
        id: metadata
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const checksums = Object.fromEntries(["neoforge", "fabric", "forge"].map(loader => {
              const manifest = JSON.parse(readFileSync(`build/mod-loaders/${loader}/manifest.json`, "utf8"));
              return [loader, manifest.sha256];
            }));
            appendFileSync(process.env.GITHUB_OUTPUT, `checksums=${JSON.stringify(checksums)}\n`);
          '

      - name: Keep the installable mod artifact
        uses: actions/upload-artifact@v7
        with:
          name: minemories-neoforge-mc1.21.1
          path: build/mod-loaders/neoforge/*
          if-no-files-found: error
          retention-days: 14

      - name: Keep the Fabric artifact (also tested under Quilt)
        uses: actions/upload-artifact@v7
        with:
          name: minemories-fabric-mc1.21.1
          path: build/mod-loaders/fabric/*
          if-no-files-found: error
          retention-days: 14

      - name: Keep the Forge artifact
        uses: actions/upload-artifact@v7
        with:
          name: minemories-forge-mc1.21.1
          path: build/mod-loaders/forge/*
          if-no-files-found: error
          retention-days: 14

  mod-artifact:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [neoforge, fabric, forge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Download the built mod in a separate job
        uses: actions/download-artifact@v8
        with:
          name: minemories-${{ matrix.loader }}-mc1.21.1
          path: downloads
      - name: Verify the downloaded JAR and metadata
        env:
          BUILD_SHA256: ${{ fromJSON(needs.quality.outputs.mod_checksums)[matrix.loader] }}
        run: node scripts/verify-mod-artifact.mjs downloads "$BUILD_SHA256" "${{ matrix.loader }}"
