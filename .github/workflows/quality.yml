name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run all checks and build applications
        run: bun run build

      - name: Verify real Garage lifecycle and recovery
        run: bun run api:garage

      - name: Keep the installable mod artifact
        uses: actions/upload-artifact@v7
        with:
          name: minemories-neoforge-mc1.21.1
          path: apps/web/public/downloads/*
          if-no-files-found: error
          retention-days: 14
