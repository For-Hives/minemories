name: Build and distribute mod

on:
  workflow_dispatch:
    inputs:
      publish_github:
        description: Publish the JAR on GitHub Releases
        type: boolean
        default: false
      publish_modrinth:
        description: Publish on Modrinth (project and secret required)
        type: boolean
        default: false
      publish_curseforge:
        description: Publish on CurseForge (project and secret required)
        type: boolean
        default: false
      tested_in_game:
        description: This exact version has been validated in Minecraft
        type: boolean
        default: false
      release_type:
        description: Release channel
        type: choice
        options: [alpha, beta, release]
        default: alpha

permissions:
  contents: read

concurrency:
  group: mod-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Read artifact version
        id: metadata
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("apps/web/public/downloads/manifest.json", "utf8"));
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: minemories-neoforge-mc1.21.1
          path: apps/web/public/downloads/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.publish_github || inputs.publish_modrinth || inputs.publish_curseforge }}
    needs: build
    runs-on: ubuntu-latest
    environment: mod-releases
    permissions:
      contents: write
    steps:
      - name: Check publication prerequisites
        env:
          IN_GAME_VALIDATED: ${{ inputs.tested_in_game }}
          RELEASE_REF: ${{ github.ref }}
          PUBLISH_MODRINTH: ${{ inputs.publish_modrinth }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PUBLISH_CURSEFORGE: ${{ inputs.publish_curseforge }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          node -e '
            if (process.env.RELEASE_REF !== "refs/heads/main" || process.env.IN_GAME_VALIDATED !== "true") {
              throw new Error("Publish only a version validated in Minecraft, from main.");
            }
            for (const platform of ["MODRINTH", "CURSEFORGE"]) {
              if (process.env[`PUBLISH_${platform}`] === "true" &&
                  (!process.env[`${platform}_PROJECT_ID`] || !process.env[`${platform}_TOKEN`])) {
                throw new Error(`Missing project ID or token for ${platform}.`);
              }
            }
          '
      - uses: actions/download-artifact@v4
        with:
          name: minemories-neoforge-mc1.21.1
          path: downloads
      - name: Publish on GitHub Releases
        if: ${{ inputs.publish_github }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: mod-v${{ needs.build.outputs.version }}
          github-commitish: ${{ github.sha }}
          github-prerelease: ${{ inputs.release_type != 'release' }}
          files: downloads/minemories-neoforge-mc1.21.1.jar
          name: Minemories ${{ needs.build.outputs.version }} · Minecraft 1.21.1
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ inputs.release_type }}
          environment: client
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          fail-mode: fail
      - name: Publish on Modrinth
        if: ${{ inputs.publish_modrinth }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: downloads/minemories-neoforge-mc1.21.1.jar
          name: Minemories ${{ needs.build.outputs.version }} · Minecraft 1.21.1
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ inputs.release_type }}
          environment: client
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          fail-mode: fail
      - name: Publish on CurseForge
        if: ${{ inputs.publish_curseforge }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: downloads/minemories-neoforge-mc1.21.1.jar
          name: Minemories ${{ needs.build.outputs.version }} · Minecraft 1.21.1
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ inputs.release_type }}
          environment: client
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          fail-mode: fail
