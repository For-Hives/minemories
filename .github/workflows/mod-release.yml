name: Distribute a validated mod release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release containing the exact JAR validated in game
        type: string
        required: true
      publish_modrinth:
        description: Publish on Modrinth (project and secret required)
        type: boolean
        default: false
      publish_curseforge:
        description: Publish on CurseForge (project and secret required)
        type: boolean
        default: false
      tested_in_game:
        description: The exact JAR from this GitHub release has been validated in Minecraft
        type: boolean
        default: false
      release_type:
        description: Catalogue release channel
        type: choice
        options: [alpha, beta, release]
        default: beta

permissions:
  contents: read

concurrency:
  group: catalogue-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  targets:
    if: github.ref == 'refs/heads/main' && (inputs.publish_modrinth || inputs.publish_curseforge)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Read the enabled catalogue targets
        id: targets
        env:
          IN_GAME_VALIDATED: ${{ inputs.tested_in_game }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { readTargets } from "./scripts/release-utils.mjs";
            if (process.env.IN_GAME_VALIDATED !== "true") throw new Error("Catalogue publication requires in-game validation of this exact release JAR.");
            appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include: await readTargets()})}\n`);
          '

  publish:
    needs: targets
    runs-on: ubuntu-latest
    environment: mod-releases
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check catalogue configuration
        env:
          PUBLISH_MODRINTH: ${{ inputs.publish_modrinth }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PUBLISH_CURSEFORGE: ${{ inputs.publish_curseforge }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          node -e '
            for (const platform of ["MODRINTH", "CURSEFORGE"]) {
              if (process.env[`PUBLISH_${platform}`] === "true" &&
                  (!process.env[`${platform}_PROJECT_ID`] || !process.env[`${platform}_TOKEN`])) {
                throw new Error(`Missing project ID or token for ${platform}.`);
              }
            }
          '
      - name: Download the published JAR and verify GitHub digest, checksum and compatibility
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET: ${{ matrix.id }}
        run: node scripts/download-release-target.mjs
      - name: Publish on Modrinth
        if: inputs.publish_modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: downloads/minemories-${{ matrix.id }}.jar
          name: Minemories ${{ steps.metadata.outputs.version }} · ${{ matrix.name }} · Minecraft ${{ matrix.minecraft }}
          version: ${{ steps.metadata.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: downloads/CHANGELOG.md
          environment: client
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          fail-mode: fail
      - name: Publish on CurseForge
        if: inputs.publish_curseforge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: downloads/minemories-${{ matrix.id }}.jar
          name: Minemories ${{ steps.metadata.outputs.version }} · ${{ matrix.name }} · Minecraft ${{ matrix.minecraft }}
          version: ${{ steps.metadata.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: downloads/CHANGELOG.md
          environment: client
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          fail-mode: fail
