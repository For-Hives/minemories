server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Preview launch: remove this header only when search indexing is intentionally enabled.
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/mime.types;

    location ~ ^/(gallery|account|viewer|share|public|moderation|admin|login|register)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /app.html =404;
    }

    # Fichiers hachés par Vite (JS, CSS, images importées) : le nom change à chaque contenu, cache d'un an.
    # Un add_header dans une location remplace ceux du serveur : le blocage d'indexation est répété.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Film de la page d'accueil (captures GLB, polices, icônes, images de repli) : fichiers non hachés,
    # cache d'un jour puis revalidation. Pour un cache plus long, versionner le dossier (/hero/v2/...).
    location /hero/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
