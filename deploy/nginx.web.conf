# Static front end (apps/web/dist). This file is only used when it is actually mounted into the deployment's nginx:
# current production (nginx/1.31.8 behind Coolify) answers without Cache-Control or X-Robots-Tag, a sign that its default
# nginx serves the folder instead of this file. See docs/features/film-assets-pipeline.md ("Server").

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Preview launch: remove this header only when search indexing is intentionally enabled.
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/mime.types;

    # Compression: precompressed files (.gz next to the original) are served as is, everything else is compressed on the
    # fly. The directives live in `server {}` (not at http level): if the host nginx already enables gzip in its
    # nginx.conf, a second declaration at the same level would make `nginx -t` fail ("gzip" directive is duplicate).
    # gzip_static ships with standard nginx; brotli_static needs the ngx_brotli module, missing from the standard image:
    # without it nginx REFUSES to start on an unknown directive, so the commented block stays commented.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_static on;
    gzip_types application/javascript application/json application/octet-stream image/svg+xml model/gltf-binary text/css text/plain text/xml;
    # brotli_static on;   # with ngx_brotli: serves the .br files built by `bun run hero:assets` (captures: 321 KB instead of 375 KB with gzip)
    # brotli on;
    # brotli_types application/javascript application/json application/octet-stream image/svg+xml model/gltf-binary text/css text/plain text/xml;


    location ~ ^/(gallery|account|viewer|share|public|moderation|admin|login|register)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /app.html =404;
    }

    # Files hashed by Vite (JS, CSS, imported images): the name changes with the content, cached for a year.
    # An add_header inside a location replaces the server ones, so the indexing block is repeated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Optimized film captures (`bun run hero:assets`): the content hash is in the name (S0.<hash>.glb, S1.<hash>.patch),
    # so they are immutable for a year. The MIME type is set here (mime.types does not know the .patch extension).
    location ~ "^/hero/captures-opt/[^/]+\.[0-9a-f]{10}\.glb$" {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location ~ "^/hero/captures-opt/[^/]+\.[0-9a-f]{10}\.patch$" {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    # The manifest (and the report) are NOT hashed and every build empties the folder: a manifest cached for a day would
    # point to deleted files (the film would fall back to the full GLBs). Revalidated on every visit (ETag).
    location /hero/captures-opt/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Home page film (raw fallback captures, fonts, icons, fallback images): unhashed files, cached for a day then
    # revalidated. For a longer cache, version the folder (/hero/v2/...).
    location /hero/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
