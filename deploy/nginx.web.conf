server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Preview launch: remove this header only when search indexing is intentionally enabled.
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/mime.types;

    location ~ ^/(gallery|viewer|share|public|moderation|login|register)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /app.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
