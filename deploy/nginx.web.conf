# Static front end (apps/web/dist) for the Coolify application (Railpack build, nginx:alpine runtime).
# Paste this whole file as the application's "Custom Nginx Configuration": Coolify writes it to
# /etc/nginx/conf.d/default.conf, inside the http {} block, so the `map` blocks below are valid there.
# Check after every change: `bun run web:smoke <base URL>` (docs/features/web-foundations.md).

# --- Indexing switch: the ONLY place that decides the X-Robots-Tag header -------------------------------------------
# Evaluated against the final $uri when headers are sent: a private route has become /app.html (try_files) and an
# unknown URL /404.html (error_page), so both stay noindex whatever the default below says.
# PRE-LAUNCH: the default line blocks every public response (pages, OG image, favicon, assets).
# LAUNCH: set the default to "" (an empty add_header value is not sent), together with a build made with
# VITE_INDEXABLE=true. Private routes, app.html and 404 keep their noindex.
map $uri $mm_robots {
    default "noindex, nofollow";
    /app.html "noindex, nofollow";
    /404.html "noindex, nofollow";
    # A language's own shell (/fr/app.html) and its private routes (/fr/gallery).
    "~^/[a-z-]+/app\.html$" "noindex, nofollow";
    "~^/(?:(?:fr|de|ru|ko|pt-br|pl|ja)/)?(gallery|account|viewer|share|public|moderation|admin|login|register)(/|$)" "noindex, nofollow";
}

# --- Cache policy, by final $uri ("" = no header) ----------------------------------------------------------------------
map $uri $mm_cache {
    default "";
    # HTML (prerendered pages, app.html shell) and crawler files: revalidate on every visit (ETag), so a page never
    # outlives the hashed chunks it references (each deploy replaces them).
    "~\.html$" "no-cache";
    "~^/(robots\.txt|sitemap\.xml)$" "no-cache";
    # Files hashed by Vite (JS, CSS, imported images): the name changes with the content.
    "~^/assets/" "public, max-age=31536000, immutable";
    # Optimized film captures (`bun run hero:assets`): content hash in the name (S0.<hash>.glb, S1.<hash>.patch).
    "~^/hero/captures-opt/[^/]+\.[0-9a-f]{10}\.(glb|patch)$" "public, max-age=31536000, immutable";
    # The manifest is not hashed and every build empties the folder: revalidate on every visit (ETag).
    "~^/hero/captures-opt/" "no-cache";
    # Home film fallbacks, fonts, icons, posters, brand images, textures, favicons: unhashed, one day then revalidation.
    "~^/hero/" "public, max-age=86400, stale-while-revalidate=604800";
    "~^/brand/" "public, max-age=86400, stale-while-revalidate=604800";
    "~^/textures/" "public, max-age=86400, stale-while-revalidate=604800";
    "~^/(favicon\.(ico|svg)|apple-touch-icon\.png|icon-(192|512)\.png)$" "public, max-age=86400, stale-while-revalidate=604800";
    /site.webmanifest "public, max-age=86400";
}

# --- Permanent redirects, matched on the raw $request_uri (the query string is kept) -----------------------------------
# $request_uri, not $uri: the `index` directive rewrites "/" to "/index.html" internally, so a rule on $uri would loop.
# Regexes are tried in order. The first path character may not be "/" or a backslash (\x5c): no "//host" or "/\host" open redirect.
map $request_uri $mm_redirect {
    default "";
    # Retired pages and former French slugs (apps/web/src/content/legacy-paths.ts, kept in step by its test), with or
    # without a trailing slash. Each goes straight to its final page: no target below is itself redirected.
    "~^/discover/*(?<mm_q>\?.*)?$" "/concept$mm_q";
    "~^/decouvrir/*(?<mm_q>\?.*)?$" "/concept$mm_q";
    "~^/nostalgia/*(?<mm_q>\?.*)?$" "/concept$mm_q";
    "~^/nostalgie/*(?<mm_q>\?.*)?$" "/concept$mm_q";
    "~^/open-source/*(?<mm_q>\?.*)?$" "/legal$mm_q";
    "~^/ranking/*(?<mm_q>\?.*)?$" "/explore$mm_q";
    "~^/classement/*(?<mm_q>\?.*)?$" "/explore$mm_q";
    "~^/explorer/*(?<mm_q>\?.*)?$" "/explore$mm_q";
    "~^/changelog/*(?<mm_q>\?.*)?$" "/versions$mm_q";
    "~^/blog/*(?<mm_q>\?.*)?$" "/how-it-works$mm_q";
    "~^/blog/premier-souvenir/*(?<mm_q>\?.*)?$" "/how-it-works$mm_q";
    "~^/fonctionnement/*(?<mm_q>\?.*)?$" "/how-it-works$mm_q";
    "~^/partager/*(?<mm_q>\?.*)?$" "/sharing$mm_q";
    "~^/telechargements/*(?<mm_q>\?.*)?$" "/downloads$mm_q";
    # English is the unprefixed site: /en and /en/concept go to / and /concept (the languages: apps/web/src/i18n/locales.ts).
    "~^/en(?:/+)?(?<mm_q>\?.*)?$" "/$mm_q";
    "~^/en(?<mm_p>/[^/\x5c?][^?]*?)/*(?<mm_q>\?.*)?$" "$mm_p$mm_q";
    # /index.html -> /, /concept/index.html -> /concept.
    "~^/index\.html(?<mm_q>\?.*)?$" "/$mm_q";
    "~^(?<mm_p>/[^/\x5c?][^?]*?)/index\.html(?<mm_q>\?.*)?$" "$mm_p$mm_q";
    # One URL per page, the canonical one: /concept/ and /concept// -> /concept ("/" itself never matches).
    "~^(?<mm_p>/[^/\x5c?](?:[^?]*[^/?])?)/+(?<mm_q>\?.*)?$" "$mm_p$mm_q";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # Behind Coolify's TLS proxy nginx only sees http on port 80: an absolute Location would send visitors to
    # http://host/... (then a second hop to https). Relative redirects keep the scheme and host of the request.
    absolute_redirect off;
    port_in_redirect off;

    # The only header lines of this file. No location below may contain an add_header: one add_header in a location
    # replaces every server-level one there, and the noindex would silently disappear.
    add_header X-Robots-Tag $mm_robots always;
    add_header Cache-Control $mm_cache;

    # Compression: precompressed files (.gz next to the original) are served as is, everything else is compressed on the
    # fly. The directives live in `server {}` (not at http level): if the host nginx already enables gzip in its
    # nginx.conf, a second declaration at the same level would make `nginx -t` fail ("gzip" directive is duplicate).
    # brotli_static needs the ngx_brotli module, missing from nginx:alpine: nginx REFUSES to start on an unknown
    # directive, so it stays commented.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_static on;
    gzip_types application/javascript application/json application/manifest+json application/octet-stream image/svg+xml model/gltf-binary text/css text/plain text/xml;
    # brotli_static on;   # with ngx_brotli: serves the .br files built by `bun run hero:assets`

    if ($mm_redirect) {
        return 301 $mm_redirect;
    }

    # Private application (gallery, account, viewer, share links, auth): the client shell, never the home page. Under a
    # language prefix (/fr/gallery) the shell is that language's (/fr/app.html: its share-link card is in French).
    # $mm_l holds the prefix with its slash ("fr/"), or nothing: /fr/app.html or /app.html, never "//app.html".
    location ~ "^/(?<mm_l>(?:fr|de|ru|ko|pt-br|pl|ja)/)?(gallery|account|viewer|share|public|moderation|admin|login|register)(/|$)" {
        try_files /${mm_l}app.html =404;
    }

    # Film captures: fixed MIME types (mime.types knows neither .glb nor .patch).
    location ~ "^/hero/captures-opt/[^/]+\.[0-9a-f]{10}\.glb$" {
        types { }
        default_type model/gltf-binary;
        try_files $uri =404;
    }
    location ~ "^/hero/captures-opt/[^/]+\.[0-9a-f]{10}\.patch$" {
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # Older mime.types files do not know the .webmanifest extension.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Shells only reachable through try_files / error_page: a direct request is a 404, not a duplicate page.
    location ~ "^/(?:[a-z-]+/)?app\.html$" {
        internal;
    }
    location = /404.html {
        internal;
    }

    # Prerendered public pages answer 200 at their slashless URL (/concept -> /concept/index.html), with no directory
    # redirect; each language's pages live under its prefix (/fr/concept). Anything else is a real 404 with the 404.html body.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
