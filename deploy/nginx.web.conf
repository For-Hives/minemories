# Front statique (apps/web/dist). Ce fichier n'est utilisé que s'il est réellement monté dans le nginx du déploiement :
# la production actuelle (nginx/1.31.8 derrière Coolify) répond sans Cache-Control ni X-Robots-Tag, signe que son nginx
# par défaut sert le dossier à la place de ce fichier. Voir docs/features/film-assets-pipeline.md (« Serveur »).

# Compression : les fichiers précompressés (.gz à côté de l'original) sont servis tels quels, le reste est compressé à la volée.
# gzip_static est dans nginx standard ; brotli_static demande le module ngx_brotli, absent de l'image standard : sans le
# module, nginx REFUSE de démarrer sur une directive inconnue, donc le bloc ci-dessous reste commenté.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_static on;
gzip_types application/javascript application/json application/octet-stream image/svg+xml model/gltf-binary text/css text/plain text/xml;
# brotli_static on;   # avec ngx_brotli : sert les .br produits par `bun run hero:assets` (captures : 321 Ko au lieu de 375 Ko en gzip)
# brotli on;
# brotli_types application/javascript application/json application/octet-stream image/svg+xml model/gltf-binary text/css text/plain text/xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Preview launch: remove this header only when search indexing is intentionally enabled.
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/mime.types;

    location ~ ^/(gallery|account|viewer|share|public|moderation|admin|login|register)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /app.html =404;
    }

    # Fichiers hachés par Vite (JS, CSS, images importées) : le nom change à chaque contenu, cache d'un an.
    # Un add_header dans une location remplace ceux du serveur : le blocage d'indexation est répété.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Captures optimisées du film (`bun run hero:assets`) : le contenu est dans le nom (S0.<hash>.glb, S1.<hash>.patch),
    # donc immuable un an. Le type MIME est fixé ici (les .patch n'ont pas d'extension connue de mime.types).
    location ~ ^/hero/captures-opt/[^/]+\.glb$ {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location ~ ^/hero/captures-opt/[^/]+\.patch$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    # Le manifeste (et le rapport) NE sont PAS hachés et chaque build vide le dossier : un manifeste mis en cache un jour
    # pointerait vers des fichiers supprimés (le film retomberait sur les GLB pleins). Revalidation à chaque visite (ETag).
    location /hero/captures-opt/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Film de la page d'accueil (captures brutes de repli, polices, icônes, images de repli) : fichiers non hachés,
    # cache d'un jour puis revalidation. Pour un cache plus long, versionner le dossier (/hero/v2/...).
    location /hero/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
