plugins { id 'net.fabricmc.fabric-loom' version '1.20.0-alpha.23' }

// Minecraft 26.3 (Java 25, unobfuscated: no mappings, no remap). The shared 1.21.1 sources are copied, adapted mechanically
// (adapt.gradle) and overlaid with the classes that had to be rewritten (overlay/java).
base { archivesName = 'minemories-fabric-mc26.3' }

// In-game validation: ./gradlew :fabric:runClientGametest (opens a Minecraft window, isolated user.home).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'minemories-gametest'
        enableClientGameTests = true
        eula = true
        username = 'MinemoriesTest'
    }
}
loom {
    accessWidenerPath = file('src/main/resources/minemories.accesswidener')
    runs.configureEach {
        // The mod reads settings and the export folder under user.home; keep the developer's own untouched.
        if (name == 'clientGameTest') vmArg "-Duser.home=${layout.buildDirectory.dir('gametest-home').get().asFile}"
    }
}

sourceSets.gametest.java.srcDir '../gametest-common/java'
sourceSets.gametest.java.srcDir '../../shared/gametest-common/java'

def adapted = rootProject.layout.buildDirectory.dir('adapted-sources')
def adaptedResources = rootProject.layout.buildDirectory.dir('adapted-resources')
sourceSets.main.java.srcDir adapted
sourceSets.main.resources.srcDir adaptedResources
tasks.named('compileJava') { dependsOn ':adaptSources' }
tasks.named('processResources') { dependsOn ':adaptSources' }

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation "net.fabricmc:fabric-loader:${findProperty('fabricLoaderVersion') ?: '0.19.5'}"
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.5'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}
tasks.withType(ProcessResources).configureEach {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// Launcher and mod-list icon, shared by every loader and Minecraft version.
apply from: rootProject.file('../shared/brand/brand.gradle')

// Production packaging of the shipped JAR (-Pminemories.prod=false keeps the dev JAR).
apply from: rootProject.file('../shared/prod.gradle')
