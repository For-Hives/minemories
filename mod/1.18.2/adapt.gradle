// Mechanical 1.21.1 -> 1.18.2 source adaptation (1.20.1 rules plus the shared pre-1.20 GUI bridge). A pattern that stops matching fails the build.
apply from: rootProject.file('../shared/compat-legacy/adapt-legacy.gradle')
ext.adaptDir = { File root ->
    def rep = { String text, String from, String to, String file ->
        if (!text.contains(from)) throw new GradleException("adapt: '${from}' not found in ${file}")
        text.replace(from, to)
    }
    def regex = { String text, String pattern, String to, String file ->
        def r = text.replaceAll(pattern, to)
        if (r == text) throw new GradleException("adapt: /${pattern}/ not found in ${file}")
        r
    }
    root.eachFileRecurse { f ->
        if (!f.name.endsWith('.java')) return
        def t = f.getText('UTF-8')
        def o = t
        def n = f.name
        t = adaptLegacyGui(t, n)
        t = t.replace('net.minecraft.client.gui.screens.options.OptionsScreen', 'net.minecraft.client.gui.screens.OptionsScreen')
        t = t.replace('net.minecraft.world.level.chunk.status.ChunkStatus', 'net.minecraft.world.level.chunk.ChunkStatus')
        t = t.replace('Math.clamp(', 'dev.minemories.compat.Clamp.clamp(')
        t = t.replace('page.entries().getLast()', 'page.entries().get(page.entries().size() - 1)')
        t = t.replace('previous.removeLast()', 'previous.remove(previous.size() - 1)')
        if (t.contains('implements VertexConsumer {')) {
            t = t.replaceAll(/(?s)@Override\s+public VertexConsumer setLight\(int light\) \{.*?\n    \}\n/, '')
            t = t.replace('implements VertexConsumer {', '''implements VertexConsumer {
    @Override public void endVertex() {}
    @Override public void defaultColor(int r, int g, int b, int a) {}
    @Override public void unsetDefaultColor() {}''')
            t = t.replaceAll(/public VertexConsumer addVertex\(float x, float y, float z\) \{/, 'public VertexConsumer vertex(double dx, double dy, double dz) { float x = (float) dx, y = (float) dy, z = (float) dz;')
            t = t.replace('public VertexConsumer setColor(', 'public VertexConsumer color(')
            t = t.replace('public VertexConsumer setUv(', 'public VertexConsumer uv(')
            t = t.replace('public VertexConsumer setUv1(', 'public VertexConsumer overlayCoords(')
            t = t.replace('public VertexConsumer setUv2(', 'public VertexConsumer uv2(')
            t = t.replace('public VertexConsumer setNormal(', 'public VertexConsumer normal(')
        }
        // Lot 1.19: renamed or relocated Minecraft API (sprites, registries, widgets, server data).
        t = t.replace('.contents().name()', '.getName()').replace('.contents().width()', '.getWidth()').replace('.contents().height()', '.getHeight()')
        t = t.replace('import net.minecraft.core.registries.BuiltInRegistries;', 'import net.minecraft.core.Registry;').replace('BuiltInRegistries.', 'Registry.')
        if (n == 'SimpleHubScreen.java') t = rep(t, 'codeInput.setHint(Component.translatable("minemories.hub.code_hint"));', 'codeInput.setSuggestion(Component.translatable("minemories.hub.code_hint").getString());', n)
        if (n == 'ClientRuntime.java') {
            t = rep(t, 'worldData.worldGenOptions().seed()', 'worldData.worldGenSettings().seed()', n)
            t = rep(t, 'byte[] icon = currentServer.getIconBytes();', 'String iconB64 = currentServer.getIconB64();\n      byte[] icon = iconB64 == null ? null : java.util.Base64.getDecoder().decode(iconB64);', n)
            t = rep(t, 'widget.getX(), widget.getY(),', 'widget.x, widget.y,', n)
            t = rep(t, 'button.setX(spot.x());', 'button.x = spot.x();', n)
            t = rep(t, 'button.setY(spot.y());', 'button.y = spot.y();', n)
            t = rep(t, 'BlockPos.containing(position)', 'new BlockPos(position)', n)
        }
        // Lot 1.18: Component factories, Screen.rebuildWidgets and RandomSource are 1.19 additions.
        t = t.replace('Component.translatable(', 'dev.minemories.compat.Components.translatable(').replace('Component.literal(', 'dev.minemories.compat.Components.literal(')
        t = t.replaceAll(/\brebuildWidgets\(\);/, 'clearWidgets(); init();')
        if (n == 'RenderedModelCapture.java') {
            t = rep(t, '!type.format().getElements().contains(VertexFormatElement.NORMAL)', 'type.format().getElements().stream().noneMatch(e -> e.getUsage() == VertexFormatElement.Usage.NORMAL)', n)
        }
        if (t != o) f.setText(t, 'UTF-8')
    }
}
