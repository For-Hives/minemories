plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless'
    id 'com.github.spotbugs'
}

evaluationDependsOn(':common')

// In-game validation: ./gradlew :neoforge:runClientGametest (opens a Minecraft window, isolated user.home).
sourceSets { gametest { java.srcDir '../gametest-common/java'; java.srcDir '../../shared/gametest-common/java' } }
dependencies { gametestImplementation sourceSets.main.output }
// The test sources are not shipped code: no formatter or bug finder runs on them.
tasks.matching { it.name == 'spotbugsGametest' }.configureEach { enabled = false }

base { archivesName = 'minemories' }

dependencies {
    implementation project(':core')
    implementation project(path: ':common', configuration: 'namedElements')
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Test-only Gson; Minecraft provides the client runtime version.
    testImplementation 'com.google.code.gson:gson:2.15.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/main/java/**/*.java'
        googleJavaFormat('1.36.0')
    }
}

spotbugs {
    toolVersion = '4.10.5'
    ignoreFailures = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keep upstream NeoForge deprecations visible while allowing the adapter to build.
    options.compilerArgs.add('-Xlint:all')
}

neoForge {
    version = '21.1.248'
    addModdingDependenciesTo(sourceSets.gametest)
    runs {
        client {
            client()
            gameDirectory = rootProject.file('run')
        }
        clientGametest {
            client()
            gameDirectory = layout.buildDirectory.dir('run-gametest')
            // The mod reads settings and the export folder under user.home; keep the developer's own untouched.
            jvmArgument "-Duser.home=${layout.buildDirectory.dir('gametest-home').get().asFile}"
            sourceSet = sourceSets.gametest
            systemProperty 'minemories.gametest', 'true'
        }
    }
    mods {
        minemories {
            sourceSet(sourceSets.main)
            sourceSet(project(':core').sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
        minemories_gametest {
            sourceSet(sourceSets.gametest)
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var props = [version: project.version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from project(':common').sourceSets.main.output
}

// Launcher and mod-list icon, shared by every loader and Minecraft version.
apply from: rootProject.file('../shared/brand/brand.gradle')

// Production packaging of the shipped JAR (-Pminemories.prod=false keeps the dev JAR).
apply from: rootProject.file('../shared/prod.gradle')
