plugins {
    id 'dev.architectury.loom-remap' version '1.17.493'
    id 'com.diffplug.spotless'
    id 'com.github.spotbugs'
}

evaluationDependsOn(':common')
base { archivesName = 'minemories-fabric' }
sourceSets { gametest { compileClasspath += sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.runtimeClasspath } }
loom {
    accessWidenerPath = project(':common').file('src/main/resources/minemories.accesswidener')
    runs {
        // In-game validation: ./gradlew :fabric:runClientGametest (opens a Minecraft window, isolated user.home).
        clientGametest {
            client()
            vmArg "-Duser.home=${layout.buildDirectory.dir('gametest-home').get().asFile}"
            vmArg '-Dminemories.gametest=true'
        }
    }
}
// GlbReport and FeatureScenario are Minecraft-free and shared with every Minecraft version.
def sharedReport = tasks.register('copyGlbReport', Copy) {
    from('../../shared/gametest-common/java/dev/minemories/gametest') { include '*.java' }
    into layout.buildDirectory.dir('gametest-shared/dev/minemories/gametest')
}
sourceSets.gametest.java.srcDir layout.buildDirectory.dir('gametest-shared')
sourceSets.gametest.java.srcDir '../gametest-common/java'
tasks.named('compileGametestJava') { dependsOn sharedReport }
// The test mod rides the dev classpath (inactive unless -Dminemories.gametest=true, set by the test run only).
sourceSets.main.runtimeClasspath += sourceSets.gametest.output
tasks.matching { it.name == 'runClientGametest' }.configureEach { dependsOn 'gametestClasses' }
// The test sources are not shipped code: no formatter or bug finder runs on them.
tasks.matching { it.name == 'spotbugsGametest' }.configureEach { enabled = false }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.5'
    implementation project(':core')
    implementation project(path: ':common', configuration: 'namedElements')
    gametestImplementation sourceSets.main.output
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
spotless { java { target 'src/main/java/**/*.java'; googleJavaFormat('1.36.0') } }
spotbugs { toolVersion = '4.10.5'; ignoreFailures = false }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:all')
}
tasks.withType(ProcessResources).configureEach {
    // Read the version at configuration time: closures cannot touch `project` under the configuration cache.
    var props = [version: project.version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
// The dev launcher only sees this project's own folders as the mod: :common's resources (access widener, translations,
// textures such as the menu icon) are copied next to fabric.mod.json, or the run fails or shows a missing texture
// (the jar already holds them once through :common's output).
tasks.named('processResources') {
    from(project(':common').file('src/main/resources'))
}
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':core').sourceSets.main.output
    from project(':common').sourceSets.main.output
}

// Launcher and mod-list icon, shared by every loader and Minecraft version.
apply from: rootProject.file('../shared/brand/brand.gradle')

// Production packaging of the shipped JAR (-Pminemories.prod=false keeps the dev JAR).
apply from: rootProject.file('../shared/prod.gradle')
