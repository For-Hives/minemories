pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'minemories'
include 'core', 'common', 'neoforge', 'fabric', 'forge'

// Loader-independent code shared by every Minecraft version lives in mod/shared.
project(':core').projectDir = file('../shared/core')
project(':common').projectDir = file('../shared/common')
