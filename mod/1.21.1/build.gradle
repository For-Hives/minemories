plugins {
    id 'base'
    id 'com.diffplug.spotless' version '8.10.4' apply false
    id 'com.github.spotbugs' version '6.5.13' apply false
}

project(':forge') { ext.set('loom.platform', 'forge') }

allprojects {
    version = rootProject.providers.gradleProperty('modVersion').getOrElse(rootProject.property('mod_version'))
    group = 'dev.minemories'
    repositories {
        mavenCentral()
    }
}

tasks.named('check') {
    dependsOn ':core:check', ':common:check', ':neoforge:check', ':fabric:check', ':forge:check'
}

tasks.named('build') {
    dependsOn ':core:build', ':common:build', ':neoforge:build', ':fabric:build', ':forge:build'
}
