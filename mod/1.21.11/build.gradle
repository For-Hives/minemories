// Shared by every loader subproject: the 1.21.1 sources are copied and adapted mechanically
// (adapt.gradle), then overlaid with the classes that had to be rewritten (overlay/java). Loader
// adapters (fabric/, neoforge/) only hold what is specific to their loader.
def shared = file('../shared')
version = file('../1.21.1/gradle.properties').readLines().find { it.startsWith('mod_version=') }.split('=')[1]

def adapted = layout.buildDirectory.dir('adapted-sources')
def adaptedResources = layout.buildDirectory.dir('adapted-resources')
tasks.register('adaptSources') {
    inputs.dir(shared.toPath().resolve('core/src/main/java').toFile())
    inputs.dir(shared.toPath().resolve('common/src/main/java').toFile())
    inputs.dir(file('overlay/java'))
    inputs.dir(shared.toPath().resolve('common/src/main/resources').toFile())
    inputs.file(file('adapt.gradle'))
    outputs.dir(adapted)
    outputs.dir(adaptedResources)
    doLast {
        def out = adapted.get().asFile
        delete out
        copy {
            from(shared.toPath().resolve('core/src/main/java').toFile())
            from(shared.toPath().resolve('common/src/main/java').toFile())
            into out
        }
        apply from: file('adapt.gradle')
        adaptDir(out)
        // An overlay file that replaces a shared class would silently miss later fixes to it, so the
        // build records which shared version each one was ported from and fails when that changes.
        def pinned = new Properties()
        file('overlay/shared-sources.properties').withInputStream { pinned.load(it) }
        fileTree('overlay/java').matching { include '**/*.java' }.each { overlay ->
            def rel = file('overlay/java').toPath().relativize(overlay.toPath()).toString()
            ['core', 'common'].collect { shared.toPath().resolve("${it}/src/main/java/${rel}").toFile() }.findAll { it.exists() }.each { original ->
                def sha = java.security.MessageDigest.getInstance('SHA-256').digest(original.bytes).encodeHex().toString()
                if (pinned.getProperty(rel) != sha)
                    throw new GradleException("overlay/java/${rel} replaces a shared class that changed (sha256 ${sha}). Port the change into the overlay, then update overlay/shared-sources.properties.")
            }
        }
        copy { from(file('overlay/java')); into out }
        // Shared resources, plus the 1.21.9+ key category translation (key.category.<namespace>.<path>).
        def res = adaptedResources.get().asFile
        delete res
        copy {
            from(shared.toPath().resolve('common/src/main/resources').toFile())
            exclude 'minemories.accesswidener'
            into res
        }
        fileTree(res).matching { include 'assets/minemories/lang/*.json' }.each { lang ->
            def json = new groovy.json.JsonSlurper().parse(lang) as Map
            if (json['key.categories.minemories'] == null) throw new GradleException("adapt: key.categories.minemories missing in ${lang.name}")
            json['key.category.minemories.minemories'] = json['key.categories.minemories']
            lang.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
        }
    }
}

subprojects {
    group = 'dev.minemories'
    version = rootProject.version
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}
