// The mod icon shown by launchers and in-game mod lists, applied by every loader adapter:
//   apply from: rootProject.file('../shared/brand/brand.gradle')
//
// One PNG (mod/shared/brand/icon.png, generated by `bun brand:icons`) is copied into the main resources at build
// time instead of being duplicated in every loader's src/main/resources:
//   - Fabric reads it from `assets/minemories/icon.png` (the "icon" entry of fabric.mod.json);
//   - Forge and NeoForge read it from the JAR root as `minemories-logo.png` (logoFile in mods.toml / neoforge.mods.toml).
def brandIcon = rootProject.file('../shared/brand/icon.png')
if (!brandIcon.isFile()) throw new GradleException("Missing mod icon ${brandIcon}: run `bun brand:icons` from the repository root.")

def fabric = project.name == 'fabric'
tasks.named('processResources', ProcessResources) {
    inputs.file(brandIcon)
    if (fabric) {
        from(brandIcon) { into 'assets/minemories' }
    } else {
        from(brandIcon) { rename { 'minemories-logo.png' } }
    }
}
