plugins {
    id 'dev.architectury.loom-remap' version '1.17.493'
    id 'com.diffplug.spotless'
    id 'com.github.spotbugs'
}

base { archivesName = 'minemories-common' }

loom {
    accessWidenerPath = file('src/main/resources/minemories.accesswidener')
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    compileOnly 'net.fabricmc:fabric-loader:0.19.5'
    mappings loom.officialMojangMappings()
    implementation project(':core')
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.15.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(Test).configureEach { useJUnitPlatform() }
spotless { java { googleJavaFormat('1.36.0') } }
spotbugs { toolVersion = '4.10.5'; ignoreFailures = false }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:all')
}
// The loaders package these named classes; the shared module is not a standalone mod.
tasks.named('remapJar') { enabled = false }
