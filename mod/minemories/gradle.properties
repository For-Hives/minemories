org.gradle.jvmargs=-Xmx3G
# Local builds keep the daemon warm; CI forces it off through scripts/gradle.mjs.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
mod_version=0.32.1-beta.1
# setup-java exposes the Minecraft toolchain when Java 25 runs Gradle in CI.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
