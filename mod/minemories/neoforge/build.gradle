plugins {
    id 'net.neoforged.moddev' version '2.0.80'
    id 'com.diffplug.spotless'
    id 'com.github.spotbugs'
}

base { archivesName = 'minemories' }

dependencies {
    implementation project(':core')
    testImplementation platform('org.junit:junit-bom:6.0.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Match Minecraft 1.21.1's Gson for standalone upload tests.
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

spotless {
    java {
        googleJavaFormat('1.36.0')
    }
}

spotbugs {
    toolVersion = '4.10.4'
    ignoreFailures = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keep upstream NeoForge deprecations visible while allowing the adapter to build.
    options.compilerArgs.add('-Xlint:all')
}

neoForge {
    version = '21.1.248'
    runs {
        client {
            client()
            gameDirectory = rootProject.file('run')
        }
    }
    mods {
        minemories {
            sourceSet(sourceSets.main)
            sourceSet(project(':core').sourceSets.main)
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var props = [version: project.version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.named('jar') {
    from project(':core').sourceSets.main.output
}
