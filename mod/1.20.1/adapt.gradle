// Mechanical 1.21.1 -> 1.20.1 source adaptation. A pattern that stops matching fails the build.
ext.adaptDir = { File root ->
    def rep = { String text, String from, String to, String file ->
        if (!text.contains(from)) throw new GradleException("adapt: '${from}' not found in ${file}")
        text.replace(from, to)
    }
    def regex = { String text, String pattern, String to, String file ->
        def r = text.replaceAll(pattern, to)
        if (r == text) throw new GradleException("adapt: /${pattern}/ not found in ${file}")
        r
    }
    root.eachFileRecurse { f ->
        if (!f.name.endsWith('.java')) return
        def t = f.getText('UTF-8')
        def o = t
        def n = f.name
        t = t.replace('net.minecraft.client.gui.screens.options.OptionsScreen', 'net.minecraft.client.gui.screens.OptionsScreen')
        t = t.replace('net.minecraft.world.level.chunk.status.ChunkStatus', 'net.minecraft.world.level.chunk.ChunkStatus')
        t = t.replace('public void renderBackground(GuiGraphics graphics, int mouseX, int mouseY, float partialTick)', 'public void renderBackground(GuiGraphics graphics)')
        t = t.replace('super.renderBackground(graphics, mouseX, mouseY, partialTick)', 'super.renderBackground(graphics)')
        // Before 1.20.2 Screen.render does not draw the background itself: screens call it first.
        t = t.replace('public void render(GuiGraphics graphics, int mouseX, int mouseY, float partialTick) {\n    super.render(graphics, mouseX, mouseY, partialTick);', 'public void render(GuiGraphics graphics, int mouseX, int mouseY, float partialTick) {\n    renderBackground(graphics);\n    super.render(graphics, mouseX, mouseY, partialTick);')
        t = t.replace('SystemToast.SystemToastId.', 'SystemToast.SystemToastIds.')
        t = t.replace('ResourceLocation.fromNamespaceAndPath(', 'new ResourceLocation(')
        t = t.replace('Math.clamp(', 'dev.minemories.compat.Clamp.clamp(')
        t = t.replace('page.entries().getLast()', 'page.entries().get(page.entries().size() - 1)')
        t = t.replace('previous.removeLast()', 'previous.remove(previous.size() - 1)')
        if (t.contains('implements VertexConsumer {')) {
            t = t.replaceAll(/(?s)@Override\s+public VertexConsumer setLight\(int light\) \{.*?\n    \}\n/, '')
            t = t.replace('implements VertexConsumer {', '''implements VertexConsumer {
    @Override public void endVertex() {}
    @Override public void defaultColor(int r, int g, int b, int a) {}
    @Override public void unsetDefaultColor() {}''')
            t = t.replaceAll(/public VertexConsumer addVertex\(float x, float y, float z\) \{/, 'public VertexConsumer vertex(double dx, double dy, double dz) { float x = (float) dx, y = (float) dy, z = (float) dz;')
            t = t.replace('public VertexConsumer setColor(', 'public VertexConsumer color(')
            t = t.replace('public VertexConsumer setUv(', 'public VertexConsumer uv(')
            t = t.replace('public VertexConsumer setUv1(', 'public VertexConsumer overlayCoords(')
            t = t.replace('public VertexConsumer setUv2(', 'public VertexConsumer uv2(')
            t = t.replace('public VertexConsumer setNormal(', 'public VertexConsumer normal(')
        }
        if (n == 'RenderedModelCapture.java') {
            t = rep(t, '!type.format().getElements().contains(VertexFormatElement.NORMAL)', 'type.format().getElements().stream().noneMatch(e -> e.getUsage() == VertexFormatElement.Usage.NORMAL)', n)
        }
        // The shared VanillaGui draws sprites and list backgrounds that 1.20.1 does not have.
        if (n == 'VanillaGui.java') t = '''package dev.minemories.client;

import net.minecraft.client.gui.GuiGraphics;
import net.minecraft.client.gui.screens.Screen;
import net.minecraft.resources.ResourceLocation;

// Minecraft 1.20.1: no sprites, list backgrounds or separator textures yet. Vanilla lists draw the
// tiled options background darkened, with a shadow on their edges: the same textures, so resource
// packs and UI mods that replace them restyle the panel. Replaces the shared class (adapt.gradle).
final class VanillaGui {
  private static final ResourceLocation TAB_BUTTON =
      new ResourceLocation("textures/gui/tab_button.png");

  private VanillaGui() {}

  static void panel(GuiGraphics graphics, int left, int top, int width, int height) {
    graphics.setColor(0.125f, 0.125f, 0.125f, 1f);
    graphics.blit(
        Screen.BACKGROUND_LOCATION, left, top, (float) left, (float) top, width, height, 32, 32);
    graphics.setColor(1f, 1f, 1f, 1f);
    shade(graphics, left, top, width, true);
    shade(graphics, left, top + height - 4, width, false);
    separator(graphics, left, top - 2, width, true);
    separator(graphics, left, top + height, width, false);
  }

  /** Four rows of black fading out, like the edges of a vanilla list. */
  private static void shade(GuiGraphics graphics, int left, int y, int width, boolean top) {
    for (int row = 0; row < 4; row++) {
      int alpha = 0xB0 >> row;
      int rowY = top ? y + row : y + 3 - row;
      graphics.fill(left, rowY, left + width, rowY + 1, alpha << 24);
    }
  }

  /** A two pixel separator whose top edge is at y: the header one sits above a list, the footer one below. */
  static void separator(GuiGraphics graphics, int left, int y, int width, boolean header) {
    graphics.fill(left, y, left + width, y + 1, header ? 0xFF000000 : 0x80000000);
    graphics.fill(left, y + 1, left + width, y + 2, header ? 0x80000000 : 0xFF000000);
  }

  /** The vanilla tab texture: raised for a selected tab, lighter when hovered or focused. */
  static void tab(
      GuiGraphics graphics,
      int x,
      int y,
      int width,
      int height,
      boolean selected,
      boolean highlighted) {
    int row = selected ? (highlighted ? 1 : 0) : (highlighted ? 3 : 2);
    // Vanilla passes a zero bottom border, which 1.20.1 only survives at the texture's own height of 24.
    graphics.blitNineSliced(TAB_BUTTON, x, y, width, height, 2, 2, 2, 1, 130, 24, 0, row * 24);
  }
}
'''
        if (t != o) f.setText(t, 'UTF-8')
    }
}
